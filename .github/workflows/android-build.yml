name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Te permite darle al botón "Run workflow" manualmente en GitHub

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de NPM
        run: npm install

      - name: Compilar Vite (React)
        run: npm run build

      - name: Sincronizar Capacitor con el build más reciente
        run: npx cap sync android

      - name: Configurar Java JDK 21 (Actualizado)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK (Modo Debug para instalar directo)
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Subir APK como Artefacto final
        uses: actions/upload-artifact@v4
        with:
          name: Tarot-Sort-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk